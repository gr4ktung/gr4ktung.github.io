<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        (function() {
            var path = window.location.pathname;
            path = path.replace(/\/+$/, '');
            var clean = path || '/';
            if (clean === '/') {
                window.location.replace('/index.html');
                return;
            }
            if (/\.html?$/.test(clean)) {
                return;
            }
            var target = clean + '.html';
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
